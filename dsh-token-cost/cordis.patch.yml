# Token cost plugin bundle.
#
# Rates and peak hours are fetched from the official DeepSeek pricing page, and
# every request is priced by the rate that was in force when it started: a price
# change splits the timeline instead of repricing history or freezing the whole
# conversation on one card.
#
# The `rates` block below is only the fallback used when the catalog cannot be
# fetched (or `pricingSource: false`). Values are peak rates in the catalog
# currency (CNY, mirroring the zh-CN page) per 1,000,000 tokens; off-peak applies
# `offPeakMultiplier`.
- insert:
    - id: token-cost
      name: '@local/dsh-token-cost'
      config:
        # Official machine-readable price page. The plugin also fetches the other
        # language copy of this same page, so amounts can be shown in either
        # currency at that currency's own published price (no conversion).
        # Set false to stay offline.
        pricingSource: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
        refreshIntervalMs: 21600000
        fetchTimeoutMs: 15000
        # Chinese public-holiday calendar: {year} is replaced with the year.
        # The default mirrors the State Council arrangement (days off, including
        # adjusted days; makeup workdays are ignored). Set false to stay offline
        # and rely on the manual `holidays` list below.
        holidaysSource: https://timor.tech/api/holiday/year/{year}
        holidayRefreshIntervalMs: 86400000
        # Extra manual holiday dates (Beijing dates), unioned with the source.
        holidays: []
        holidayOffsetMinutes: 480
        # Optional policy overrides; omitted means use the catalog's windows.
        # peakWindows: [[60, 240], [360, 600]]
        # weekdaysOnly: true
        # Display currency. Empty = follow the interface language: the Chinese UI
        # shows CNY, the English UI shows USD, each from its own published table.
        # Set CNY or USD to pin one regardless of language.
        currency: ''
        symbol: ''
        # Multiplies the card's own rates (1 = no conversion). Leave at 1 to keep
        # the published prices exact in both currencies.
        exchangeRate: 1
        offPeakEnabled: true
        # "included": reasoning tokens are already inside outputTokens.
        # "separate": charge reasoningTokens at the output rate as well.
        reasoningBilling: included
        rates:
          deepseek-flash:
            input: 2
            cacheRead: 0.04
            cacheWrite: 2
            output: 8
            offPeakMultiplier: 0.5
          deepseek-v4-pro:
            input: 9
            cacheRead: 0.3
            cacheWrite: 9
            output: 27
            offPeakMultiplier: 0.5
          default:
            input: 2
            cacheRead: 0.04
            cacheWrite: 2
            output: 8
            offPeakMultiplier: 0.5
