<!--
  Minimal outerHTML snapshot of the DSH 0.2.1-rc.2 sidebar shell (Windows, expanded).

  Provenance: structure captured from the installed desktop archive
  (D:/software/deepseek-harness/resources/app.asar, package version 0.2.1-rc.2):

    dsh/node_modules/@deepseek-ai/dsh-client-ui-sidebar/lib/client.js
      - hashed class map: SidebarRoot_module_css_default (root/logoRow/newSession)
      - render: SidebarRoot() returns div.<root> with children
        logoRow, newSession, panelList, regionArea, footArea

  The three classes the sidebar-clock adapter depends on:
    root       _2H3hWW_root
    logoRow    _2H3hWW_logoRow
    newSession _2H3hWW_newSession

  React-owned icon subtrees are intentionally omitted; label text is kept only as
  a placeholder. Only the element hierarchy, classes and wide-state attributes
  that the adapter can observe are preserved.
  Used by tests/sidebar-clock-adapter.test.cjs.
  See docs/compatibility.md for how to re-capture this fixture after a DSH upgrade.
-->
<div class="_2H3hWW_root _2H3hWW_quietBars" style="width: 280px">
  <div class="_2H3hWW_logoRow" data-window-drag>
    <button type="button" class="_2H3hWW_brand _2H3hWW_wide" aria-label="新建会话">
      <span class="_2H3hWW_brandIdentity" aria-hidden="true">
        <span class="_2H3hWW_brandMark"></span>
        <span class="_2H3hWW_brandName">DeepSeek Harness</span>
      </span>

    <button type="button" class="_2H3hWW_iconButton _2H3hWW_toggle" aria-label="收起侧边栏"></button>
  </div>
  <button type="button" class="_2H3hWW_newSession" aria-label="新建会话">

      <span class="_2H3hWW_newSessionContent">
        <span class="_2H3hWW_newSessionLabel _2H3hWW_wide">新会话</span>
      </span>
    </span>
  </button>
  <nav class="_2H3hWW_panelList" aria-label="全局面板">

      <span class="_2H3hWW_panelGlyph" aria-hidden="true"></span>

  </nav>
  <div class="_2H3hWW_regionArea"></div>
  <div class="_2H3hWW_footArea">
